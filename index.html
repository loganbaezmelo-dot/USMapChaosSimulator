<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>US Map Chaos Simulator</title>
<style>
  :root {
    --bg-dark: #070b12;
    --panel-bg: rgba(13, 19, 31, 0.96);
    --border-color: #24344b;
    --text-main: #f0f4fc;
    --text-dim: #8e9fb8;
    --accent-gold: #ffd166;
    --accent-red: #ef476f;
    --accent-green: #06d6a0;
    --accent-purple: #b5179e;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    background: var(--bg-dark);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  #app {
    display: flex;
    width: 100vw;
    height: 100vh;
  }

  #viewport {
    flex: 1;
    position: relative;
    background: radial-gradient(ellipse at 50% 50%, #152238 0%, #070c16 100%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  svg#map {
    width: 100%;
    height: 100%;
    max-height: 98vh;
  }

  .cell-tile {
    stroke: rgba(0, 0, 0, 0.2);
    stroke-width: 0.6;
    cursor: pointer;
    transition: fill 0.12s ease;
  }

  .cell-tile.ocean {
    stroke: none;
    fill: transparent !important;
    pointer-events: none;
  }

  .dock-box {
    stroke: #25374f;
    stroke-width: 1.5;
    stroke-dasharray: 4, 4;
    fill: rgba(10, 16, 28, 0.55);
    pointer-events: none;
  }

  .dock-label {
    fill: var(--text-dim);
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    pointer-events: none;
  }

  .capital-marker {
    fill: #ffffff;
    stroke: #dc2626;
    stroke-width: 2.2;
    filter: drop-shadow(0 0 4px rgba(0,0,0,0.9));
    cursor: pointer;
    transition: cx 0.25s ease-out, cy 0.25s ease-out;
  }

  .capital-marker.dodging {
    fill: #ffd166;
    stroke: #ff0055;
    filter: drop-shadow(0 0 10px #ff0055);
  }

  .state-label {
    fill: #ffffff;
    font-size: 8.5px;
    font-weight: 900;
    text-anchor: middle;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.95), 0 0 5px rgba(0,0,0,0.9);
  }

  #stats-overlay {
    position: absolute;
    top: 14px;
    left: 14px;
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    padding: 8px 14px;
    border-radius: 8px;
    display: flex;
    gap: 16px;
    font-size: 0.88rem;
    font-weight: 800;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }

  #toast {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(13, 19, 31, 0.95);
    border: 1px solid var(--accent-gold);
    color: #fff;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 800;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s ease;
    z-index: 100;
    box-shadow: 0 0 12px rgba(255, 209, 102, 0.25);
  }

  #sidebar {
    width: 380px;
    background: var(--panel-bg);
    border-left: 2px solid var(--border-color);
    display: flex;
    flex-direction: column;
    padding: 14px;
    gap: 10px;
    backdrop-filter: blur(10px);
    z-index: 10;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 8px;
  }

  .panel-title {
    font-weight: 900;
    font-size: 1.05rem;
    color: var(--accent-gold);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-badge {
    background: #192434;
    border: 1px solid #2e415b;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 800;
  }

  .controls-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
  }

  button.btn {
    background: #192434;
    color: #fff;
    border: 1px solid var(--border-color);
    padding: 9px;
    font-size: 0.8rem;
    font-weight: 800;
    border-radius: 8px;
    cursor: pointer;
    touch-action: manipulation;
    transition: all 0.15s ease;
  }

  button.btn:active {
    transform: scale(0.96);
  }

  button.btn-accent {
    background: #e63946;
    border-color: #ff4d6d;
  }

  button.btn-gold {
    background: #ca8a04;
    border-color: #facc15;
    color: #fff;
  }

  .select-row {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .select-row label {
    font-size: 0.7rem;
    color: var(--text-dim);
    font-weight: 800;
  }

  select {
    background: #0f1624;
    border: 1px solid var(--border-color);
    color: #fff;
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 0.82rem;
    outline: none;
    font-weight: 700;
  }

  .tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: #0d1421;
    border-radius: 6px;
    padding: 2px;
    border: 1px solid var(--border-color);
    gap: 2px;
  }

  .tab-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 6px 2px;
    font-size: 0.7rem;
    font-weight: 800;
    cursor: pointer;
    border-radius: 4px;
    text-align: center;
  }

  .tab-btn.active {
    background: #1c283c;
    color: #fff;
  }

  .scroll-container {
    flex: 1;
    background: #080d15;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .log-entry {
    padding: 5px 7px;
    border-radius: 4px;
    background: #101724;
    border-left: 3px solid #64748b;
    font-size: 0.74rem;
    line-height: 1.35;
  }

  .log-war { border-left-color: var(--accent-red); }
  .log-buy { border-left-color: var(--accent-gold); }
  .log-merge { border-left-color: var(--accent-purple); }
  .log-revolt { border-left-color: #f97316; }
  .log-alliance { border-left-color: var(--accent-green); }
  .log-dodge { border-left-color: #38bdf8; }
  .log-bailout { border-left-color: #eab308; background: #161a22; }
  .log-decap { border-left-color: #ff0055; background: #1f101a; }

  .data-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 8px;
    background: #101724;
    border-radius: 5px;
    font-size: 0.76rem;
  }

  .row-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .color-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .alliance-card {
    background: #101724;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .alliance-title {
    font-weight: 800;
    color: var(--accent-gold);
    font-size: 0.8rem;
    display: flex;
    justify-content: space-between;
  }

  .alliance-members {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .member-tag {
    background: #192434;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 4px;
  }
</style>
</head>
<body>

<div id="app">
  <div id="viewport">
    <div id="stats-overlay">
      <div>Year: <span id="year-count" style="color:var(--accent-gold)">1</span></div>
      <div>Active Nations: <span id="nation-count" style="color:var(--accent-green)">51</span></div>
    </div>

    <div id="toast">Simulation Ready!</div>

    <svg id="map" viewBox="0 0 960 600">
      <defs>
        <pattern id="sea-dots" width="16" height="16" patternUnits="userSpaceOnUse">
          <circle cx="2" cy="2" r="0.8" fill="rgba(255,255,255,0.05)" />
        </pattern>
      </defs>

      <rect width="960" height="600" fill="url(#sea-dots)" />

      <!-- Dock Sectors -->
      <g id="dock-frames">
        <rect x="30" y="500" width="150" height="85" rx="8" class="dock-box" />
        <text x="40" y="515" class="dock-label">Sector Alaska</text>

        <rect x="200" y="500" width="150" height="85" rx="8" class="dock-box" />
        <text x="210" y="515" class="dock-label">Sector Hawaii</text>

        <rect x="780" y="500" width="150" height="85" rx="8" class="dock-box" />

      </g>

      <g id="cell-grid"></g>
      <g id="capitals"></g>
      <g id="labels"></g>
    </svg>
  </div>

  <div id="sidebar">
    <div class="panel-header">
      <div class="panel-title">⚡ STATE SIMULATOR</div>
      <div class="status-badge" id="sim-status">PAUSED</div>
    </div>

    <div class="controls-grid">
      <button class="btn btn-accent" id="btn-toggle">START / PAUSE</button>
      <button class="btn" id="btn-step">NEXT TURN</button>
      <button class="btn btn-gold" id="btn-random-rich">REROLL COIN KING</button>
      <button class="btn" id="btn-drain">WASTE RESOURCES</button>
    </div>

    <div class="select-row">
      <label>MANUAL COIN INJECTION:</label>
      <select id="state-select">
        <option value="">-- Choose State to Fund --</option>
      </select>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-log">FEED</button>
      <button class="tab-btn" id="tab-lb">RANK</button>
      <button class="tab-btn" id="tab-sizes">SIZES</button>
      <button class="tab-btn" id="tab-alliances">ALLIANCES</button>
    </div>

    <div class="scroll-container" id="feed-container"></div>
    <div class="scroll-container" id="lb-container" style="display:none;"></div>
    <div class="scroll-container" id="sizes-container" style="display:none;"></div>
    <div class="scroll-container" id="alliances-container" style="display:none;"></div>
  </div>
</div>

  NJ: { name: "New Jersey", seed: [38, 9] },
  NY: { name: "New York", seed: [35, 6] },
  CT: { name: "Connecticut", seed: [38, 7] },
  RI: { name: "Rhode Island", seed: [39, 7] },
  MA: { name: "Massachusetts", seed: [38, 6] },
  VT: { name: "Vermont", seed: [36, 4] },
  NH: { name: "New Hampshire", seed: [38, 4] },
  ME: { name: "Maine", seed: [40, 3] },
  AK: { name: "Alaska", seed: [4, 27] },
  HI: { name: "Hawaii", seed: [13, 27] },
  PR: { name: "Puerto Rico", seed: [42, 27] }
};

let grid = [];
let nations = {};
let year = 1;
let isRunning = false;
let simInterval = null;
let lastRevoltYear = 0;

function initSimulation() {
  grid = [];
  nations = {};
  let colorIdx = 0;
  lastRevoltYear = 0;

  Object.keys(STATE_DEFS).forEach(id => {
    const def = STATE_DEFS[id];
    nations[id] = {
      id: id,
      name: def.name,
      color: VIBRANT_COLORS[colorIdx % VIBRANT_COLORS.length],
      coins: Math.floor(Math.random() * 450) + 250,
      cells: [],
      allies: [],
      mergedWith: null,
      isMergedSub: false,
      isEliminated: false,
      targetFocus: null, // Tracks if currently focusing on eliminating a smaller state
      capital: { x: 0, y: 0, col: def.seed[0], row: def.seed[1] }
    };
    colorIdx++;
  });

  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < COLS; c++) {
      if (COASTLINE_MASK[r][c] === 0) {
        grid[r][c] = null;
        continue;
      }

      let bestId = null;

      if (r >= 25) {
        if (c >= 1 && c <= 8) bestId = "AK";
        else if (c >= 10 && c <= 17) bestId = "HI";
        else if (c >= 39 && c <= 46) bestId = "PR";
        else if (c >= 31 && c <= 35) bestId = "FL";
      } else {
        if (r === 14 && c >= 14 && c <= 17) {
          bestId = "OK";
        } else if (r === 13 && c >= 25 && c <= 31) {
          bestId = "KY";
        } else if (r === 15 && c >= 24 && c <= 31) {
          bestId = "TN";
        } else if ((r === 21 || r === 22) && (c >= 23 && c <= 25)) {
          bestId = "MS";
        } else if ((r === 21 || r === 22) && (c >= 26 && c <= 27)) {
          bestId = "AL";
        } else if ((r === 21 || r === 22) && (c >= 28 && c <= 32)) {
          bestId = "FL";
        } else {
          let minDist = 999999;
          Object.keys(STATE_DEFS).forEach(id => {
            if (["AK", "HI", "PR"].includes(id)) return;
            const def = STATE_DEFS[id];
            const dx = c - def.seed[0];
            const dy = r - def.seed[1];
            const dist = (dx * dx) + (dy * dy);

            if (dist < minDist) {
              minDist = dist;
              bestId = id;
            }
          });
        }
      }

      if (bestId && nations[bestId]) {
        grid[r][c] = bestId;
        nations[bestId].cells.push({ col: c, row: r });
      } else {
        grid[r][c] = null;
      }
    }
  }

  Object.keys(nations).forEach(id => recalcCentroid(id));

  renderMap();
  populateDropdown();
  updateUI();
  addLog("Simulator initialized with Capital Awareness & Retaliation mechanics.", "log-dodge");
}

function recalcCentroid(nationId) {
  const nation = nations[nationId];
  if (!nation || nation.cells.length === 0) return;

  let sumCol = 0, sumRow = 0;
  nation.cells.forEach(cell => {
    sumCol += cell.col;
    sumRow += cell.row;
  });

  const avgCol = sumCol / nation.cells.length;
  const avgRow = sumRow / nation.cells.length;

  let bestCell = nation.cells[0];
  let minDist = 999999;

  nation.cells.forEach(cell => {
    const d = Math.pow(cell.col - avgCol, 2) + Math.pow(cell.row - avgRow, 2);
    if (d < minDist) {
      minDist = d;
      bestCell = cell;
    }
  });

  nation.capital.x = (bestCell.col * CELL_W) + (CELL_W / 2);
  nation.capital.y = (bestCell.row * CELL_H) + (CELL_H / 2);
  nation.capital.col = bestCell.col;
  nation.capital.row = bestCell.row;
}

function renderMap() {
  const cellGroup = document.getElementById("cell-grid");
  const capGroup = document.getElementById("capitals");
  const lblGroup = document.getElementById("labels");

  cellGroup.innerHTML = "";
  capGroup.innerHTML = "";
  lblGroup.innerHTML = "";

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ownerId = grid[r][c];
      const isWater = !ownerId;

      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("x", c * CELL_W);
      rect.setAttribute("y", r * CELL_H);
      rect.setAttribute("width", CELL_W);
      rect.setAttribute("height", CELL_H);
      rect.setAttribute("id", `cell-${c}-${r}`);

      if (isWater) {
        rect.setAttribute("class", "cell-tile ocean");
      } else {
        rect.setAttribute("class", "cell-tile");
        rect.setAttribute("fill", nations[ownerId].color);
        rect.addEventListener("click", () => handleCellClick(c, r));
      }
      cellGroup.appendChild(rect);
    }
  }

  Object.keys(nations).forEach(id => {
    const nation = nations[id];

    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("cx", nation.capital.x);
    circle.setAttribute("cy", nation.capital.y);
    circle.setAttribute("r", 4.5);
    circle.setAttribute("id", "cap-" + id);
    circle.setAttribute("class", "capital-marker");
    circle.addEventListener("click", (e) => {
      e.stopPropagation();
      manualMoveCapital(id);
    });
    capGroup.appendChild(circle);

    const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
    txt.setAttribute("x", nation.capital.x);
    txt.setAttribute("y", nation.capital.y - 7);
    txt.setAttribute("id", "lbl-" + id);
    txt.setAttribute("class", "state-label");
    txt.textContent = id;
    lblGroup.appendChild(txt);
  });
}

function paintMap() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ownerId = grid[r][c];
      const el = document.getElementById(`cell-${c}-${r}`);
      if (el) {
        if (ownerId && nations[ownerId]) {
          el.setAttribute("fill", nations[ownerId].color);
          el.setAttribute("class", "cell-tile");
        } else {
          el.setAttribute("class", "cell-tile ocean");
        }
      }
    }
  }

  Object.keys(nations).forEach(id => {
    const nation = nations[id];
    const cap = document.getElementById("cap-" + id);
    const lbl = document.getElementById("lbl-" + id);

    if (!cap || !lbl) return;

    if (nation.cells.length === 0 || nation.isMergedSub || nation.isEliminated) {
      cap.style.display = "none";
      lbl.style.display = "none";
    } else {
      cap.style.display = "block";
      lbl.style.display = "block";
      cap.setAttribute("cx", nation.capital.x);
      cap.setAttribute("cy", nation.capital.y);
      lbl.setAttribute("x", nation.capital.x);
      lbl.setAttribute("y", nation.capital.y - 7);
    }
  });
}

// CAPITAL PROXIMITY 1-5PX SCAN & DECISION LOGIC:
// - If enemy gets 1-5px from capital:
// - If the target state is focused on eliminating something else and is small/medium: it FAILS to notice and gets eliminated!
// - If the target state is big (30+ cells): it NOTICES even when attacking, relocates capital, and counter-attacks!
function checkCapitalProximityThreats(activeIds) {
  activeIds.forEach(targetId => {
    const victim = nations[targetId];
    if (!victim || victim.isEliminated || victim.cells.length === 0) return;

    const capCol = victim.capital.col;
    const capRow = victim.capital.row;
    const isIslandSector = capRow >= 25;

    let closestEnemy = null;
    let shortestDist = 999;

    // Scan 1 to 5 cells in all directions from the capital
    for (let dr = -5; dr <= 5; dr++) {
      for (let dc = -5; dc <= 5; dc++) {
        const nr = capRow + dr;
        const nc = capCol + dc;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
          const owner = grid[nr][nc];
          if (owner && owner !== targetId && !victim.allies.includes(owner) && !nations[owner].isEliminated) {
            // Islands cannot decapitate mainland capitals unless they have a mainland cell
            if (!isIslandSector && nr >= 25 && !nations[owner].cells.some(c => c.row < 25)) {
              continue;
            }
            const dist = Math.max(Math.abs(dr), Math.abs(dc));
            if (dist < shortestDist) {
              shortestDist = dist;
              closestEnemy = owner;
            }
          }
        }
      }
    }

    // Capital has an enemy within 1-5 cells!
    if (closestEnemy && shortestDist <= 5) {
      const invader = nations[closestEnemy];
      const isBigState = victim.cells.length >= 28;
      const isDistracted = (victim.targetFocus !== null);

      // CASE 1: Distracted small/medium state fails to notice in time -> Instant Decapitation!
      if (!isBigState && isDistracted) {
        addLog(`🎯 SNEAK DECAPITATION (${shortestDist}px): ${invader.name} reached ${victim.name}'s capital while it was distracted eliminating ${nations[victim.targetFocus]?.name || 'rebels'}! ${victim.name} is ELIMINATED!`, "log-decap");
        executeCapitalAnnexation(targetId, closestEnemy);
        return;
      }

      // CASE 2: Big empire notices even while distracted, moves capital and counter-attacks
      if (isBigState) {
        // Find safe inland cells
        const inlandCells = victim.cells.filter(c => {
          return Math.abs(c.col - capCol) > 2 || Math.abs(c.row - capRow) > 2;
        });

        if (inlandCells.length > 0) {
          const newCell = inlandCells[Math.floor(inlandCells.length / 2)];
          victim.capital.x = (newCell.col * CELL_W) + (CELL_W / 2);
          victim.capital.y = (newCell.row * CELL_H) + (CELL_H / 2);
          victim.capital.col = newCell.col;
          victim.capital.row = newCell.row;

          const capEl = document.getElementById("cap-" + targetId);
          if (capEl) {
            capEl.classList.add("dodging");
            setTimeout(() => capEl.classList.remove("dodging"), 400);
          }

          addLog(`🚨 AWARENESS: ${victim.name} (Large Empire) noticed ${invader.name} sneaking within ${shortestDist}px of its capital! Capital evacuated!`, "log-dodge");

          // Retaliation counter-invasion
          retaliateAgainstSneakInvader(victim, invader);
        } else {
          // No inland cells left for even a big state -> falls!
          executeCapitalAnnexation(targetId, closestEnemy);
        }
        return;
      }

      // CASE 3: Small state NOT currently distracted has a normal 60% chance to evacuate, otherwise falls!
      if (Math.random() < 0.60 && victim.cells.length > 3) {
        const safeCell = victim.cells[Math.floor(victim.cells.length / 2)];
        victim.capital.x = (safeCell.col * CELL_W) + (CELL_W / 2);
        victim.capital.y = (safeCell.row * CELL_H) + (CELL_H / 2);
        victim.capital.col = safeCell.col;
        victim.capital.row = safeCell.row;
        addLog(`⚠️ ALERT: ${victim.name} quickly relocated capital away from approaching ${invader.name} troops!`, "log-dodge");
      } else {
        addLog(`💥 CAPITAL OVERRUN (${shortestDist}px): ${invader.name} breached ${victim.name}'s capital before it could react! ${victim.name} is ELIMINATED!`, "log-decap");
        executeCapitalAnnexation(targetId, closestEnemy);
      }
    }
  });
}

function retaliateAgainstSneakInvader(defender, attacker) {
  if (attacker.cells.length === 0 || defender.coins < 20) return;

  const counterCount = Math.min(attacker.cells.length, Math.floor(Math.random() * 4) + 3);
  for (let i = 0; i < counterCount; i++) {
    if (attacker.cells.length === 0) break;
    const c = attacker.cells.pop();
    grid[c.row][c.col] = defender.id;
    defender.cells.push(c);
  }

  const defCost = (counterCount * 18) + 20;
  defender.coins = Math.max(0, defender.coins - defCost);
  recalcCentroid(defender.id);
  recalcCentroid(attacker.id);

  addLog(`⚔️ RETALIATION: ${defender.name} turned its armies around and annexed ${counterCount}px from reckless ${attacker.name}!`, "log-war");

  if (attacker.cells.length === 0) {
    attacker.isEliminated = true;
    addLog(`💀 ${attacker.name} was wiped out after failing their capital raid against ${defender.name}!`, "log-war");
  }
}

function executeCapitalAnnexation(victimId, conquerorId) {
  const victim = nations[victimId];
  const conqueror = nations[conquerorId];
  if (!victim || victim.isEliminated) return;

  victim.isEliminated = true;
  victim.targetFocus = null;

  const capEl = document.getElementById("cap-" + victimId);
  const lblEl = document.getElementById("lbl-" + victimId);
  if (capEl) capEl.style.display = "none";
  if (lblEl) lblEl.style.display = "none";

  victim.cells.forEach(cell => {
    const rect = document.getElementById(`cell-${cell.col}-${cell.row}`);
    if (rect) rect.setAttribute("fill", "#ffffff");
  });

  showToast(`${victim.name} capital conquered by ${conqueror.name}!`);

  setTimeout(() => {
    distributeEliminatedTerritory(victimId, conquerorId);
    paintMap();
    updateUI();
  }, 350);
}

function distributeEliminatedTerritory(victimId, primaryConquerorId) {
  const victim = nations[victimId];
  const oldCells = [...victim.cells];
  victim.cells = [];
  victim.coins = 0;

  const dirs = [[0,1], [0,-1], [1,0], [-1,0]];

  oldCells.forEach(cell => {
    let chosenNeighbor = null;

    for (let [dc, dr] of dirs) {
      const nc = cell.col + dc;
      const nr = cell.row + dr;
      if (nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS) {
        const owner = grid[nr][nc];
        if (owner && owner !== victimId && nations[owner] && !nations[owner].isEliminated && !nations[owner].isMergedSub) {
          chosenNeighbor = owner;
          break;
        }
      }
    }

    const winnerId = chosenNeighbor || primaryConquerorId;
    grid[cell.row][cell.col] = winnerId;
    if (nations[winnerId]) {
      nations[winnerId].cells.push(cell);
    }
  });

  Object.keys(nations).forEach(id => {
    if (!nations[id].isEliminated && nations[id].cells.length > 0) {
      recalcCentroid(id);
    }
  });

  addLog(`🗺️ SURROUNDING STATES DIVIDED ${victim.name}'s lands!`, "log-buy");
}

function manualMoveCapital(nationId) {
  const nation = nations[nationId];
  if (!nation || nation.cells.length === 0 || nation.isEliminated) return;
  const randomCell = nation.cells[Math.floor(Math.random() * nation.cells.length)];
  nation.capital.x = (randomCell.col * CELL_W) + (CELL_W / 2);
  nation.capital.y = (randomCell.row * CELL_H) + (CELL_H / 2);
  nation.capital.col = randomCell.col;
  nation.capital.row = randomCell.row;
  paintMap();
  showToast(`${nation.name} manually moved capital!`);
}

function handleBankruptcies(activeIds) {
  activeIds.forEach(id => {
    const nation = nations[id];
    if (nation.coins > 0) return;

    const wealthyAllies = nation.allies
      .filter(allyId => nations[allyId] && !nations[allyId].isEliminated && nations[allyId].coins >= 180);

    if (wealthyAllies.length > 0) {
      const donor = nations[wealthyAllies[Math.floor(Math.random() * wealthyAllies.length)]];
      const isBig = Math.random() < 0.35 && donor.coins >= 450;
      const donation = isBig ? Math.floor(Math.random() * 250) + 300 : Math.floor(Math.random() * 100) + 80;

      donor.coins -= donation;
      nation.coins += donation;
      addLog(`🤝 ALLIANCE BAILOUT: ${donor.name} sent ${donation}g to bankrupt capital of ${nation.name}!`, "log-bailout");
      return;
    }

    const neighbors = findFrontierNeighbors(nation);
    const hostileNeighbors = neighbors.filter(nid => !nation.allies.includes(nid) && nations[nid].coins > 30);

    if (hostileNeighbors.length > 0 && Math.random() < 0.35) {
      const invaderId = hostileNeighbors[Math.floor(Math.random() * hostileNeighbors.length)];
      addLog(`💀 BANKRUPTCY OVERRUN: ${nation.name} had 0 coins and fell to ${nations[invaderId].name}!`, "log-war");
      executeCapitalAnnexation(id, invaderId);
    }
  });
}

function stepTurn() {
  year++;
  document.getElementById("year-count").textContent = year;

  Object.keys(nations).forEach(id => {
    const nation = nations[id];
    if (nation.cells.length === 0 || nation.isMergedSub || nation.isEliminated) return;

    const baseIncome = Math.floor(nation.cells.length * 1.7) + 6;
    const militaryUpkeep = Math.floor(nation.cells.length * 1.5);
    nation.coins = Math.max(0, nation.coins + baseIncome - militaryUpkeep);
  });

  let activeIds = Object.keys(nations).filter(id => nations[id].cells.length > 0 && !nations[id].isMergedSub && !nations[id].isEliminated);
  if (activeIds.length <= 1) {
    pauseSimulation();
    showToast(`Simulation complete! Hegemon: ${nations[activeIds[0]].name}`);
    return;
  }

  handleBankruptcies(activeIds);

  // Capital Proximity Decapitation & Awareness Checks
  checkCapitalProximityThreats(activeIds);

  const actionsThisTurn = Math.min(activeIds.length, Math.floor(Math.random() * 3) + 2);

  for (let a = 0; a < actionsThisTurn; a++) {
    activeIds = Object.keys(nations).filter(id => nations[id].cells.length > 0 && !nations[id].isMergedSub && !nations[id].isEliminated);
    if (activeIds.length <= 1) break;

    const actorId = activeIds[Math.floor(Math.random() * activeIds.length)];
    const actor = nations[actorId];

    if (actor.coins <= 0) continue;

    const roll = Math.random();

    if (roll < 0.20 && actor.coins >= 350) {
      attemptChunkPurchase(actor);
    } else if (roll < 0.36) {
      attemptAlliance(actor, activeIds);
    } else if (roll < 0.50 && actor.cells.length < 18) {
      attemptWartimeMerge(actor, activeIds);
    } else if (roll < 0.52 && (year - lastRevoltYear >= 6)) {
      attemptRevolt(activeIds);
    } else {
      attemptMilitaryPush(actor, activeIds);
    }
  }

  paintMap();
  updateUI();
}

function attemptMilitaryPush(actor, activeIds) {
  if (actor.coins <= 0) return;

  let frontierCells = findFrontierCells(actor);

  if (frontierCells.length === 0) {
    const foreignNations = activeIds.filter(id => id !== actor.id && !actor.allies.includes(id));
    if (foreignNations.length === 0 || actor.coins < 220) return;

    const targetNationId = foreignNations[Math.floor(Math.random() * foreignNations.length)];
    const targetNation = nations[targetNationId];
    if (targetNation.cells.length === 0) return;

    const navalLanding = targetNation.cells[Math.floor(Math.random() * targetNation.cells.length)];
    frontierCells = [navalLanding];
    addLog(`⚓ NAVAL INVASION: ${actor.name} mounted overseas assault on ${targetNation.name}!`, "log-war");
  }

  const target = frontierCells[Math.floor(Math.random() * frontierCells.length)];
  const defenderId = grid[target.row][target.col];
  const defender = nations[defenderId];

  if (!defender || defender.isEliminated || defenderId === actor.id) return;

  // Set target focus (distraction mechanic)
  actor.targetFocus = defenderId;

  if (actor.allies.includes(defenderId)) {
    if (Math.random() < 0.6) return;
    actor.allies = actor.allies.filter(a => a !== defenderId);
    defender.allies = defender.allies.filter(a => a !== actor.id);
    addLog(`💔 Alliance broken: ${actor.name} declared war on ${defender.name}!`, "log-war");
  }

  const attackerBudget = Math.min(actor.coins, 250);
  const defenderBudget = Math.min(defender.coins, 250);

  const attackerPower = (actor.cells.length * 2.5) + (attackerBudget * 0.4) + (Math.random() * 35);
  const defenderPower = (defender.cells.length * 2.5) + (defenderBudget * 0.4) + (Math.random() * 35);

  if (attackerPower >= defenderPower * 0.82) {
    const campaignSize = Math.floor(Math.random() * 6) + 5;
    const conquered = Math.min(defender.cells.length, campaignSize);

    for (let i = 0; i < conquered; i++) {
      if (defender.cells.length === 0) break;
      const c = defender.cells.pop();
      grid[c.row][c.col] = actor.id;
      actor.cells.push(c);
    }

    const militaryExpenditure = (conquered * 22) + 40;
    actor.coins = Math.max(0, actor.coins - militaryExpenditure);
    defender.coins = Math.max(0, defender.coins - Math.floor(conquered * 8));

    recalcCentroid(actor.id);
    recalcCentroid(defender.id);

    if (defender.cells.length === 0) {
      defender.isEliminated = true;
      actor.targetFocus = null;
      addLog(`💀 ${defender.name} collapsed completely! Annexed by ${actor.name}! (-${militaryExpenditure}g)`, "log-war");
    } else {
      addLog(`⚔️ ${actor.name} annexed ${conquered}px from ${defender.name} for ${militaryExpenditure}g!`, "log-war");
    }
  } else {
    actor.coins = Math.max(0, actor.coins - 85);
    addLog(`🛡️ ${defender.name} repulsed ${actor.name}'s assault! (-85g)`, "log-dodge");
    actor.targetFocus = null;
  }
}

function attemptChunkPurchase(actor) {
  const frontier = findFrontierCells(actor);
  if (frontier.length === 0) return;

  const target = frontier[Math.floor(Math.random() * frontier.length)];
  const sellerId = grid[target.row][target.col];
  const seller = nations[sellerId];

  if (!seller || seller.isEliminated || sellerId === actor.id) return;

  const price = 220 + (seller.cells.length * 8);
  if (actor.coins >= price) {
    actor.coins -= price;
    seller.coins += Math.floor(price * 0.85);

    const chunk = Math.min(seller.cells.length - 1, 5);
    for (let i = 0; i < chunk; i++) {
      if (seller.cells.length <= 1) break;
      const c = seller.cells.pop();
      grid[c.row][c.col] = actor.id;
      actor.cells.push(c);
    }

    recalcCentroid(actor.id);
    recalcCentroid(seller.id);
    addLog(`💰 ${actor.name} bought borderlands from ${seller.name} for ${price} gold!`, "log-buy");
  }
}

function attemptAlliance(actor, activeIds) {
  const candidates = activeIds.filter(id => id !== actor.id && !actor.allies.includes(id));
  if (candidates.length === 0) return;

  const allyId = candidates[Math.floor(Math.random() * candidates.length)];
  actor.allies.push(allyId);
  nations[allyId].allies.push(actor.id);
  addLog(`🤝 Alliance forged: ${actor.name} & ${nations[allyId].name}!`, "log-alliance");
}

function attemptWartimeMerge(actor, activeIds) {
  const frontier = findFrontierCells(actor);
  const smallNeighbors = frontier.map(f => grid[f.row][f.col]).filter(id => id && id !== actor.id && nations[id].cells.length <= 16 && !nations[id].isEliminated);
  if (smallNeighbors.length === 0) return;

  const partnerId = smallNeighbors[0];
  const partner = nations[partnerId];

  partner.cells.forEach(c => {
    grid[c.row][c.col] = actor.id;
    actor.cells.push(c);
  });
  partner.cells = [];
  partner.isMergedSub = true;
  partner.mergedWith = actor.id;
  actor.coins += partner.coins;
  partner.coins = 0;

  recalcCentroid(actor.id);
  addLog(`🧬 MERGER: ${partner.name} merged into ${actor.name} for defense!`, "log-merge");
}

function attemptRevolt(activeIds) {
  const giantEmpires = activeIds.filter(id => nations[id].cells.length >= 40);
  if (giantEmpires.length === 0) return;

  const targetEmpire = nations[giantEmpires[Math.floor(Math.random() * giantEmpires.length)]];
  const rebelNationIds = Object.keys(nations).filter(id => (nations[id].cells.length === 0 || nations[id].isEliminated));
  if (rebelNationIds.length === 0) return;

  const rebelId = rebelNationIds[Math.floor(Math.random() * rebelNationIds.length)];
  const rebel = nations[rebelId];

  rebel.isMergedSub = false;
  rebel.isEliminated = false;
  rebel.mergedWith = null;
  rebel.coins = 320;

  const revoltSize = Math.min(8, Math.floor(targetEmpire.cells.length * 0.18));
  for (let i = 0; i < revoltSize; i++) {
    if (targetEmpire.cells.length <= 10) break;
    const c = targetEmpire.cells.pop();
    grid[c.row][c.col] = rebel.id;
    rebel.cells.push(c);
  }

  recalcCentroid(rebel.id);
  recalcCentroid(targetEmpire.id);
  lastRevoltYear = year;
  addLog(`🔥 REBELLION: ${rebel.name} declared independence from ${targetEmpire.name}!`, "log-revolt");
}

function findFrontierCells(actor) {
  const frontiers = [];
  const dirs = [[0,1], [0,-1], [1,0], [-1,0]];

  actor.cells.forEach(cell => {
    dirs.forEach(([dc, dr]) => {
      const nc = cell.col + dc;
      const nr = cell.row + dr;
      if (nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS) {
        if (grid[nr][nc] && grid[nr][nc] !== actor.id && !nations[grid[nr][nc]].isEliminated) {
          frontiers.push({ col: nc, row: nr });
        }
      }
    });
  });
  return frontiers;
}

function findFrontierNeighbors(actor) {
  const neighbors = new Set();
  const dirs = [[0,1], [0,-1], [1,0], [-1,0]];

  actor.cells.forEach(cell => {
    dirs.forEach(([dc, dr]) => {
      const nc = cell.col + dc;
      const nr = cell.row + dr;
      if (nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS) {
        const o = grid[nr][nc];
        if (o && o !== actor.id && !nations[o].isEliminated) {
          neighbors.add(o);
        }
      }
    });
  });
  return Array.from(neighbors);
}

function handleCellClick(col, row) {
  const ownerId = grid[row][col];
  if (!ownerId) return;
  const owner = nations[ownerId];
  showToast(`${owner.name} (${ownerId}) | Cells: ${owner.cells.length} | Gold: ${owner.coins}g`);
}

function getFormedAlliances(activeNations) {
  const visited = new Set();
  const pacts = [];

  const pactPrefixes = ["Grand", "United", "Federal", "Atlantic", "Pacific", "Continental", "Sovereign", "Mutual"];
  const pactSuffixes = ["Coalition", "Pact", "League", "Alliance", "Accord", "Entente", "Treaty"];

  activeNations.forEach(nation => {
    if (visited.has(nation.id)) return;

    if (nation.allies.length > 0) {
      const allianceMembers = [nation];
      visited.add(nation.id);

      nation.allies.forEach(allyId => {
        if (!visited.has(allyId) && nations[allyId] && !nations[allyId].isEliminated) {
          allianceMembers.push(nations[allyId]);
          visited.add(allyId);
        }
      });

      if (allianceMembers.length > 1) {
        const lead = allianceMembers[0];
        const hash = (lead.name.charCodeAt(0) + allianceMembers.length) % pactPrefixes.length;
        const name = `${pactPrefixes[hash]} ${lead.name} ${pactSuffixes[hash % pactSuffixes.length]}`;
        const totalPx = allianceMembers.reduce((sum, m) => sum + m.cells.length, 0);
        const totalGold = allianceMembers.reduce((sum, m) => sum + m.coins, 0);

        pacts.push({
          name: name,
          members: allianceMembers,
          totalPx: totalPx,
          totalGold: totalGold
        });
      }
    }
  });

  return pacts.sort((a, b) => b.totalPx - a.totalPx);
}

function updateUI() {
  const activeNations = Object.values(nations).filter(n => n.cells.length > 0 && !n.isMergedSub && !n.isEliminated);
  document.getElementById("nation-count").textContent = activeNations.length;

  const rankSorted = [...activeNations].sort((a, b) => (b.cells.length * 100 + b.coins) - (a.cells.length * 100 + a.coins));
  const lbContainer = document.getElementById("lb-container");
  lbContainer.innerHTML = "";

  rankSorted.forEach((n, idx) => {
    const row = document.createElement("div");
    row.className = "data-row";
    row.innerHTML = `
      <div class="row-left">
        <span style="color:var(--text-dim);width:20px;">#${idx+1}</span>
        <div class="color-dot" style="background:${n.color}"></div>
        <strong>${n.name}</strong>
      </div>
      <div>
        <span style="color:var(--text-dim);margin-right:8px;">${n.cells.length} px</span>
        <span style="color:var(--accent-gold);font-weight:800;">${n.coins}g</span>
      </div>
    `;
    lbContainer.appendChild(row);
  });

  const sizeSorted = [...activeNations].sort((a, b) => b.cells.length - a.cells.length);
  const sizesContainer = document.getElementById("sizes-container");
  sizesContainer.innerHTML = "";

  sizeSorted.forEach((n, idx) => {
    const pct = ((n.cells.length / TOTAL_MAP_CELLS) * 100).toFixed(1);
    const row = document.createElement("div");
    row.className = "data-row";
    row.innerHTML = `
      <div class="row-left">
        <span style="color:var(--text-dim);width:20px;">#${idx+1}</span>
        <div class="color-dot" style="background:${n.color}"></div>
        <strong>${n.name}</strong>
      </div>
      <div>
        <span style="color:var(--accent-green);font-weight:800;margin-right:8px;">${pct}%</span>
        <span style="color:var(--text-dim);font-weight:700;">${n.cells.length} px</span>
      </div>
    `;
    sizesContainer.appendChild(row);
  });

  const alliancesContainer = document.getElementById("alliances-container");
  alliancesContainer.innerHTML = "";
  const pacts = getFormedAlliances(activeNations);

  if (pacts.length === 0) {
    alliancesContainer.innerHTML = '<div style="padding:15px;color:var(--text-dim);text-align:center;font-size:0.8rem;">No active military alliances. Total chaos reigns.</div>';
  } else {
    pacts.forEach(p => {
      const card = document.createElement("div");
      card.className = "alliance-card";
      card.innerHTML = `
        <div class="alliance-title">
          <span>🛡️ ${p.name}</span>
          <span style="color:var(--accent-green);">${p.totalPx} px (${p.totalGold}g)</span>
        </div>
        <div class="alliance-members">
          ${p.members.map(m => `
            <div class="member-tag">
              <span class="color-dot" style="background:${m.color};width:7px;height:7px;"></span>
              <span>${m.id}</span>
            </div>
          `).join('')}
        </div>
      `;
      alliancesContainer.appendChild(card);
    });
  }
}

function addLog(msg, typeClass) {
  const container = document.getElementById("feed-container");
  const entry = document.createElement("div");
  entry.className = `log-entry ${typeClass || ''}`;
  entry.textContent = `[Y${year}] ${msg}`;
  container.prepend(entry);
  if (container.children.length > 50) {
    container.removeChild(container.lastChild);
  }
}

function showToast(text) {
  const toast = document.getElementById("toast");
  toast.textContent = text;
  toast.style.opacity = "1";
  setTimeout(() => toast.style.opacity = "0", 2200);
}

function populateDropdown() {
  const sel = document.getElementById("state-select");
  sel.innerHTML = '<option value="">-- Choose State to Fund --</option>';
  Object.keys(nations).forEach(id => {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = nations[id].name;
    sel.appendChild(opt);
  });

  sel.addEventListener("change", (e) => {
    const chosen = e.target.value;
    if (chosen && nations[chosen]) {
      nations[chosen].coins += 5000;
      addLog(`👑 ROYAL GRANT: ${nations[chosen].name} received 5,000 coins!`, "log-buy");
      updateUI();
      paintMap();
    }
  });
}

function toggleSimulation() {
  if (isRunning) {
    pauseSimulation();
  } else {
    isRunning = true;
    document.getElementById("sim-status").textContent = "RUNNING";
    document.getElementById("sim-status").style.color = "var(--accent-green)";
    simInterval = setInterval(stepTurn, 450);
  }
}

function pauseSimulation() {
  isRunning = false;
  clearInterval(simInterval);
  document.getElementById("sim-status").textContent = "PAUSED";
  document.getElementById("sim-status").style.color = "#fff";
}

document.getElementById("btn-toggle").addEventListener("click", toggleSimulation);
document.getElementById("btn-step").addEventListener("click", stepTurn);

document.getElementById("btn-random-rich").addEventListener("click", () => {
  const activeIds = Object.keys(nations).filter(id => nations[id].cells.length > 0 && !nations[id].isMergedSub && !nations[id].isEliminated);
  if (activeIds.length === 0) return;
  const pickedId = activeIds[Math.floor(Math.random() * activeIds.length)];
  nations[pickedId].coins += Math.floor(Math.random() * 4000) + 2000;
  addLog(`🎰 JACKPOT: ${nations[pickedId].name} struck gold!`, "log-buy");
  showToast(`${nations[pickedId].name} is now filthy rich!`);
  updateUI();
});

document.getElementById("btn-drain").addEventListener("click", () => {
  Object.keys(nations).forEach(id => {
    const nation = nations[id];
    const lost = Math.floor(nation.coins * 0.5);
    nation.coins = Math.max(0, nation.coins - lost);
  });
  addLog("📉 RESOURCE DRAIN: All active factions burned 50% of treasury!", "log-war");
  showToast("Mass resource drain applied!");
  updateUI();
});

const tabButtons = [
  { btn: "tab-log", panel: "feed-container" },
  { btn: "tab-lb", panel: "lb-container" },
  { btn: "tab-sizes", panel: "sizes-container" },
  { btn: "tab-alliances", panel: "alliances-container" }
];

tabButtons.forEach(tab => {
  document.getElementById(tab.btn).addEventListener("click", () => {
    tabButtons.forEach(t => {
      document.getElementById(t.btn).classList.remove("active");
      document.getElementById(t.panel).style.display = "none";
    });
    document.getElementById(tab.btn).classList.add("active");
    document.getElementById(tab.panel).style.display = "flex";
  });
});

window.addEventListener("DOMContentLoaded", initSimulation);
</script>
</body>
