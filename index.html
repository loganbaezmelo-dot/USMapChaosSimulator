<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>US Map Chaos Simulator</title>
<style>
  :root {
    --bg-dark: #090e17;
    --panel-bg: rgba(14, 20, 32, 0.96);
    --border-color: #26354a;
    --text-main: #f0f4fc;
    --text-dim: #8e9fb8;
    --accent-gold: #ffd166;
    --accent-red: #ef476f;
    --accent-green: #06d6a0;
    --accent-purple: #b5179e;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    background: #060a12;
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  #app {
    display: flex;
    width: 100vw;
    height: 100vh;
  }

  #viewport {
    flex: 1;
    position: relative;
    background: radial-gradient(ellipse at 50% 50%, #152238 0%, #070c16 100%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  svg#map {
    width: 100%;
    height: 100%;
    max-height: 98vh;
  }

  /* Ages of Conflict Cell Tiles */
  .cell-tile {
    stroke: rgba(0, 0, 0, 0.15);
    stroke-width: 0.5;
    transition: fill 0.15s ease;
    cursor: pointer;
  }

  .cell-tile.ocean {
    stroke: rgba(255, 255, 255, 0.03);
    cursor: pointer;
  }

  .dock-box {
    stroke: #25374f;
    stroke-width: 1.5;
    stroke-dasharray: 4, 4;
    fill: rgba(10, 16, 28, 0.5);
    pointer-events: none;
  }

  .dock-label {
    fill: var(--text-dim);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    pointer-events: none;
  }

  .capital-marker {
    fill: #ffffff;
    stroke: #dc2626;
    stroke-width: 2.2;
    filter: drop-shadow(0 0 4px rgba(0,0,0,0.9));
    cursor: pointer;
    transition: cx 0.3s ease-out, cy 0.3s ease-out;
  }

  .capital-marker.dodging {
    fill: #ffd166;
    stroke: #ff0055;
    filter: drop-shadow(0 0 10px #ff0055);
  }

  .state-label {
    fill: #ffffff;
    font-size: 9px;
    font-weight: 900;
    text-anchor: middle;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.95), 0 0 5px rgba(0,0,0,0.9);
  }

  /* HUD overlay */
  #stats-overlay {
    position: absolute;
    top: 14px;
    left: 14px;
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    padding: 8px 14px;
    border-radius: 8px;
    display: flex;
    gap: 16px;
    font-size: 0.88rem;
    font-weight: 800;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }

  #toast {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(13, 19, 31, 0.95);
    border: 1px solid var(--accent-gold);
    color: #fff;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 800;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s ease;
    z-index: 100;
    box-shadow: 0 0 12px rgba(255, 209, 102, 0.25);
  }

  /* Sidebar Tablet Controller */
  #sidebar {
    width: 360px;
    background: var(--panel-bg);
    border-left: 2px solid var(--border-color);
    display: flex;
    flex-direction: column;
    padding: 14px;
    gap: 12px;
    backdrop-filter: blur(10px);
    z-index: 10;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 10px;
  }

  .panel-title {
    font-weight: 900;
    font-size: 1.05rem;
    color: var(--accent-gold);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-badge {
    background: #192434;
    border: 1px solid #2e415b;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 800;
  }

  .controls-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  button.btn {
    background: #192434;
    color: #fff;
    border: 1px solid var(--border-color);
    padding: 10px;
    font-size: 0.82rem;
    font-weight: 800;
    border-radius: 8px;
    cursor: pointer;
    touch-action: manipulation;
    transition: all 0.15s ease;
  }

  button.btn:active {
    transform: scale(0.96);
  }

  button.btn-accent {
    background: #e63946;
    border-color: #ff4d6d;
  }

  button.btn-gold {
    background: #ca8a04;
    border-color: #facc15;
    color: #fff;
  }

  .select-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .select-row label {
    font-size: 0.72rem;
    color: var(--text-dim);
    font-weight: 800;
  }

  select {
    background: #0f1624;
    border: 1px solid var(--border-color);
    color: #fff;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 0.85rem;
    outline: none;
    font-weight: 700;
  }

  .tabs {
    display: flex;
    background: #0d1421;
    border-radius: 6px;
    padding: 2px;
    border: 1px solid var(--border-color);
  }

  .tab-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 7px;
    font-size: 0.78rem;
    font-weight: 800;
    cursor: pointer;
    border-radius: 4px;
  }

  .tab-btn.active {
    background: #1c283c;
    color: #fff;
  }

  .scroll-container {
    flex: 1;
    background: #080d15;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .log-entry {
    padding: 5px 7px;
    border-radius: 4px;
    background: #101724;
    border-left: 3px solid #64748b;
    font-size: 0.76rem;
    line-height: 1.35;
  }

  .log-war { border-left-color: var(--accent-red); }
  .log-buy { border-left-color: var(--accent-gold); }
  .log-merge { border-left-color: var(--accent-purple); }
  .log-revolt { border-left-color: #f97316; }
  .log-alliance { border-left-color: var(--accent-green); }
  .log-dodge { border-left-color: #38bdf8; }

  .lb-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 8px;
    background: #101724;
    border-radius: 4px;
    font-size: 0.78rem;
  }

  .lb-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .color-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
</style>
</head>
<body>

<div id="app">
  <div id="viewport">
    <div id="stats-overlay">
      <div>Year: <span id="year-count" style="color:var(--accent-gold)">1</span></div>
      <div>Active Nations: <span id="nation-count" style="color:var(--accent-green)">51</span></div>
    </div>

    <div id="toast">Florida invaded Havana!</div>

    <svg id="map" viewBox="0 0 960 600">
      <!-- Sector Dock Frames for Relocated States -->
      <g id="dock-frames">
        <rect x="40" y="470" width="160" height="110" rx="8" class="dock-box" />
        <text x="50" y="488" class="dock-label">Sector Alaska</text>

        <rect x="220" y="470" width="160" height="110" rx="8" class="dock-box" />
        <text x="230" y="488" class="dock-label">Sector Hawaii</text>

        <rect x="760" y="470" width="160" height="110" rx="8" class="dock-box" />
        <text x="770" y="488" class="dock-label">Sector Puerto Rico</text>
      </g>

      <!-- Ages of Conflict Pixel Cell Layer -->
      <g id="cell-grid"></g>

      <!-- Capitals Layer (Free to dodge anywhere on territory) -->
      <g id="capitals"></g>

      <!-- Dynamic Nation Name Centroids -->
      <g id="labels"></g>
    </svg>
  </div>

  <div id="sidebar">
    <div class="panel-header">
      <div class="panel-title">⚡ STATE SIMULATOR</div>
      <div class="status-badge" id="sim-status">PAUSED</div>
    </div>

    <div class="controls-grid">
      <button class="btn btn-accent" id="btn-toggle">START / PAUSE</button>
      <button class="btn" id="btn-step">NEXT TURN</button>
      <button class="btn btn-gold" id="btn-random-rich">REROLL COIN KING</button>
      <button class="btn" id="btn-drain">WASTE RESOURCES</button>
    </div>

    <div class="select-row">
      <label>MANUAL COIN INJECTION:</label>
      <select id="state-select">
        <option value="">-- Choose State to Fund --</option>
      </select>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-log">BATTLE FEED</button>
      <button class="tab-btn" id="tab-lb">LEADERBOARD</button>
    </div>

    <div class="scroll-container" id="feed-container"></div>
    <div class="scroll-container" id="lb-container" style="display:none;"></div>
  </div>
</div>

<script>
// --- AGES OF CONFLICT GRID FORMAT (48x30 CELL MAP) ---
const COLS = 48;
const ROWS = 30;
const CELL_W = 20;
const CELL_H = 20;

// Vibrant colors for nations
const VIBRANT_COLORS = [
  "#ef476f", "#f78c6c", "#ffd166", "#06d6a0", "#118ab2",
  "#8338ec", "#3a86ff", "#ff006e", "#fb5607", "#70e000",
  "#38bdf8", "#a855f7", "#ec4899", "#14b8a6", "#f43f5e",
  "#6366f1", "#84cc16", "#eab308", "#06b6d4", "#f97316"
];

// 50 States + Puerto Rico + Ocean Zones
const STATE_DEFS = {
  // Pacific
  WA: { name: "Washington", seed: [6, 3] },
  OR: { name: "Oregon", seed: [5, 6] },
  CA: { name: "California", seed: [4, 12] },
  ID: { name: "Idaho", seed: [8, 5] },
  NV: { name: "Nevada", seed: [7, 10] },
  AZ: { name: "Arizona", seed: [8, 16] },
  UT: { name: "Utah", seed: [11, 10] },
  MT: { name: "Montana", seed: [13, 4] },
  WY: { name: "Wyoming", seed: [13, 8] },
  CO: { name: "Colorado", seed: [15, 11] },
  NM: { name: "New Mexico", seed: [13, 16] },

  // Midwest / Plains
  ND: { name: "North Dakota", seed: [19, 4] },
  SD: { name: "South Dakota", seed: [19, 7] },
  NE: { name: "Nebraska", seed: [19, 10] },
  KS: { name: "Kansas", seed: [19, 13] },
  OK: { name: "Oklahoma", seed: [19, 16] },
  TX: { name: "Texas", seed: [18, 20] },
  MN: { name: "Minnesota", seed: [23, 5] },
  IA: { name: "Iowa", seed: [23, 10] },
  MO: { name: "Missouri", seed: [23, 13] },
  AR: { name: "Arkansas", seed: [23, 17] },
  LA: { name: "Louisiana", seed: [23, 21] },

  // Central / Lakes
  WI: { name: "Wisconsin", seed: [26, 7] },
  IL: { name: "Illinois", seed: [26, 11] },
  MI: { name: "Michigan", seed: [29, 7] },
  IN: { name: "Indiana", seed: [28, 11] },
  OH: { name: "Ohio", seed: [31, 10] },
  KY: { name: "Kentucky", seed: [29, 14] },
  TN: { name: "Tennessee", seed: [29, 16] },
  MS: { name: "Mississippi", seed: [26, 19] },
  AL: { name: "Alabama", seed: [28, 19] },

  // Southeast & East
  FL: { name: "Florida", seed: [32, 23] },
  GA: { name: "Georgia", seed: [31, 19] },
  SC: { name: "South Carolina", seed: [34, 18] },
  NC: { name: "North Carolina", seed: [34, 15] },
  VA: { name: "Virginia", seed: [34, 13] },
  WV: { name: "West Virginia", seed: [32, 12] },
  MD: { name: "Maryland", seed: [36, 11] },
  DE: { name: "Delaware", seed: [38, 11] },
  PA: { name: "Pennsylvania", seed: [35, 9] },
  NJ: { name: "New Jersey", seed: [38, 10] },

  // Northeast
  NY: { name: "New York", seed: [35, 7] },
  CT: { name: "Connecticut", seed: [39, 8] },
  RI: { name: "Rhode Island", seed: [40, 8] },
  MA: { name: "Massachusetts", seed: [39, 7] },
  VT: { name: "Vermont", seed: [37, 5] },
  NH: { name: "New Hampshire", seed: [39, 5] },
  ME: { name: "Maine", seed: [41, 4] },

  // Relocated Docks
  AK: { name: "Alaska", seed: [4, 26] },
  HI: { name: "Hawaii", seed: [13, 26] },
  PR: { name: "Puerto Rico", seed: [41, 26] },

  // Annexable Ocean Hubs
  PACIFIC_N: { name: "North Pacific", seed: [1, 4], isOcean: true },
  PACIFIC_S: { name: "South Pacific", seed: [1, 16], isOcean: true },
  GULF_ZONE: { name: "Gulf of Mexico", seed: [20, 24], isOcean: true },
  CARIBBEAN: { name: "Caribbean", seed: [34, 26], isOcean: true },
  ATLANTIC_MID: { name: "Mid Atlantic", seed: [42, 15], isOcean: true },
  ATLANTIC_N: { name: "North Atlantic", seed: [44, 8], isOcean: true }
};

let grid = []; // 2D array of cell ownership
let nations = {};
let year = 1;
let isRunning = false;
let simInterval = null;

// Initialize Ages-of-Conflict Voronoi Cell Field
function initSimulation() {
  grid = [];
  nations = {};
  let colorIdx = 0;

  // Setup Nations
  Object.keys(STATE_DEFS).forEach(id => {
    const def = STATE_DEFS[id];
    const isOcean = !!def.isOcean;

    nations[id] = {
      id: id,
      name: def.name,
      color: isOcean ? "#111d2e" : VIBRANT_COLORS[colorIdx % VIBRANT_COLORS.length],
      coins: isOcean ? 100 : Math.floor(Math.random() * 800) + 400,
      cells: [],
      allies: [],
      mergedWith: null,
      isMergedSub: false,
      capital: { x: 0, y: 0, col: def.seed[0], row: def.seed[1] },
      isOcean: isOcean
    };

    if (!isOcean) colorIdx++;
  });

  // Build Grid & Assign Cells to Closest Seed (True Voronoi Territory generation)
  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < COLS; c++) {
      // Mainland bounding & Dock boundaries
      let bestId = null;
      let minDist = 999999;

      // Restrict Dock zones strictly
      if (r >= 24) {
        if (c >= 2 && c <= 9) bestId = "AK";
        else if (c >= 11 && c <= 18) bestId = "HI";
        else if (c >= 38 && c <= 45) bestId = "PR";
        else if (c >= 28 && c <= 37) bestId = "CARIBBEAN";
        else bestId = "GULF_ZONE";
      } else {
        // Upper Mainland & Ocean assignments
        Object.keys(STATE_DEFS).forEach(id => {
          const def = STATE_DEFS[id];
          if (["AK", "HI", "PR"].includes(id)) return; // don't leak out of docks
          
          const dx = c - def.seed[0];
          const dy = r - def.seed[1];
          const dist = (dx * dx) + (dy * dy);

          if (dist < minDist) {
            minDist = dist;
            bestId = id;
          }
        });
      }

      grid[r][c] = bestId;
      nations[bestId].cells.push({ col: c, row: r });
    }
  }

  // Update Nation Capitals to actual centroids
  Object.keys(nations).forEach(id => {
    recalcCentroid(id);
  });

  renderMap();
  populateDropdown();
  updateUI();
  addLog("Ages of Conflict Voronoi Grid initialized. Zero wireframe borders.", "log-dodge");
}

function recalcCentroid(nationId) {
  const nation = nations[nationId];
  if (!nation || nation.cells.length === 0) return;

  let sumX = 0, sumY = 0;
  nation.cells.forEach(cell => {
    sumX += (cell.col * CELL_W) + (CELL_W / 2);
    sumY += (cell.row * CELL_H) + (CELL_H / 2);
  });

  nation.capital.x = Math.round(sumX / nation.cells.length);
  nation.capital.y = Math.round(sumY / nation.cells.length);
}

// Render DOM cells
function renderMap() {
  const cellGroup = document.getElementById("cell-grid");
  const capGroup = document.getElementById("capitals");
  const lblGroup = document.getElementById("labels");

  cellGroup.innerHTML = "";
  capGroup.innerHTML = "";
  lblGroup.innerHTML = "";

  // Render SVG Rectangles for all cells
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ownerId = grid[r][c];
      const nation = nations[ownerId];

      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("x", c * CELL_W);
      rect.setAttribute("y", r * CELL_H);
      rect.setAttribute("width", CELL_W);
      rect.setAttribute("height", CELL_H);
      rect.setAttribute("id", `cell-${c}-${r}`);
      rect.setAttribute("class", nation.isOcean ? "cell-tile ocean" : "cell-tile");
      rect.setAttribute("fill", nation.color);
      rect.addEventListener("click", () => handleCellClick(c, r));
      cellGroup.appendChild(rect);
    }
  }

  // Render Capitals
  Object.keys(nations).forEach(id => {
    const nation = nations[id];
    if (nation.isOcean) return;

    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("cx", nation.capital.x);
    circle.setAttribute("cy", nation.capital.y);
    circle.setAttribute("r", 5);
    circle.setAttribute("id", "cap-" + id);
    circle.setAttribute("class", "capital-marker");
    circle.addEventListener("click", (e) => {
      e.stopPropagation();
      manualMoveCapital(id);
    });
    capGroup.appendChild(circle);

    const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
    txt.setAttribute("x", nation.capital.x);
    txt.setAttribute("y", nation.capital.y - 7);
    txt.setAttribute("id", "lbl-" + id);
    txt.setAttribute("class", "state-label");
    txt.textContent = id;
    lblGroup.appendChild(txt);
  });
}

// Fast dynamic redraw
function paintMap() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ownerId = grid[r][c];
      const nation = nations[ownerId];
      const el = document.getElementById(`cell-${c}-${r}`);
      if (el && nation) {
        el.setAttribute("fill", nation.color);
      }
    }
  }

  // Update Capitals & Labels
  Object.keys(nations).forEach(id => {
    const nation = nations[id];
    const cap = document.getElementById("cap-" + id);
    const lbl = document.getElementById("lbl-" + id);

    if (!cap || !lbl) return;

    if (nation.cells.length === 0 || nation.isMergedSub) {
      cap.style.display = "none";
      lbl.style.display = "none";
    } else {
      cap.style.display = "block";
      lbl.style.display = "block";
      cap.setAttribute("cx", nation.capital.x);
      cap.setAttribute("cy", nation.capital.y);
      lbl.setAttribute("x", nation.capital.x);
      lbl.setAttribute("y", nation.capital.y - 7);
    }
  });
}

// Intelligent Capital Dodge
function checkCapitalDangerAndDodge(nationId) {
  const nation = nations[nationId];
  if (!nation || nation.cells.length <= 3) return;

  // Check if current capital coordinates are under enemy adjacent threat
  const capCol = Math.floor(nation.capital.x / CELL_W);
  const capRow = Math.floor(nation.capital.y / CELL_H);

  let nearHostile = false;
  const dirs = [[0,1], [0,-1], [1,0], [-1,0]];
  for (let [dc, dr] of dirs) {
    const nc = capCol + dc;
    const nr = capRow + dr;
    if (nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS) {
      if (grid[nr][nc] !== nationId) {
        nearHostile = true;
        break;
      }
    }
  }

  if (nearHostile) {
    // Pick deep safe cell furthest from borders
    const safeCell = nation.cells[Math.floor(nation.cells.length / 2)];
    nation.capital.x = (safeCell.col * CELL_W) + (CELL_W / 2);
    nation.capital.y = (safeCell.row * CELL_H) + (CELL_H / 2);

    const capEl = document.getElementById("cap-" + nationId);
    if (capEl) {
      capEl.classList.add("dodging");
      setTimeout(() => capEl.classList.remove("dodging"), 400);
    }
    addLog(`🚨 ${nation.name} capital evacuated deeper inland!`, "log-dodge");
  }
}

function manualMoveCapital(nationId) {
  const nation = nations[nationId];
  if (!nation || nation.cells.length === 0) return;
  const randomCell = nation.cells[Math.floor(Math.random() * nation.cells.length)];
  nation.capital.x = (randomCell.col * CELL_W) + (CELL_W / 2);
  nation.capital.y = (randomCell.row * CELL_H) + (CELL_H / 2);
  paintMap();
  showToast(`${nation.name} manually moved capital!`);
}

// Ages of Conflict Simulation Step
function stepTurn() {
  year++;
  document.getElementById("year-count").textContent = year;

  // Economy & resource maintenance
  Object.keys(nations).forEach(id => {
    const nation = nations[id];
    if (nation.cells.length === 0 || nation.isMergedSub) return;

    const income = (nation.cells.length * 6) + Math.floor(Math.random() * 15);
    const upkeep = Math.floor(nation.cells.length * 2);
    nation.coins = Math.max(0, nation.coins + income - upkeep);

    checkCapitalDangerAndDodge(id);
  });

  const activeIds = Object.keys(nations).filter(id => nations[id].cells.length > 0 && !nations[id].isMergedSub);
  if (activeIds.length <= 1) {
    pauseSimulation();
    showToast(`Simulation ended! Champion: ${nations[activeIds[0]].name}`);
    return;
  }

  const actorId = activeIds[Math.floor(Math.random() * activeIds.length)];
  const actor = nations[actorId];
  const roll = Math.random();

  // 1. Buyout Frontier Chunk
  if (roll < 0.28 && actor.coins >= 450) {
    attemptChunkPurchase(actor);
  }
  // 2. Alliance
  else if (roll < 0.44) {
    attemptAlliance(actor, activeIds);
  }
  // 3. Coalition Merge
  else if (roll < 0.58 && actor.cells.length < 15) {
    attemptWartimeMerge(actor, activeIds);
  }
  // 4. Revolt
  else if (roll < 0.72) {
    attemptRevolt(activeIds);
  }
  // 5. Military Frontier Push
  else {
    attemptMilitaryPush(actor);
  }

  paintMap();
  updateUI();
}

// Military Frontier Push: Annexes 3-8 contiguous border cells from neighbor
function attemptMilitaryPush(actor) {
  const frontierCells = findFrontierCells(actor);
  if (frontierCells.length === 0) return;

  const target = frontierCells[Math.floor(Math.random() * frontierCells.length)];
  const defenderId = grid[target.row][target.col];
  const defender = nations[defenderId];

  if (actor.allies.includes(defenderId)) {
    if (Math.random() < 0.6) return;
    actor.allies = actor.allies.filter(a => a !== defenderId);
    defender.allies = defender.allies.filter(a => a !== actor.id);
    addLog(`💔 Alliance broken: ${actor.name} attacked ${defender.name}!`, "log-war");
  }

  const attackerPower = (actor.cells.length * 2) + (actor.coins * 0.1) + (Math.random() * 20);
  const defenderPower = (defender.cells.length * 2) + (defender.coins * 0.1) + (Math.random() * 20);

  if (attackerPower >= defenderPower * 0.85) {
    // Push across frontier (3 to 6 cells)
    const conquered = Math.min(defender.cells.length, Math.floor(Math.random() * 4) + 3);
    for (let i = 0; i < conquered; i++) {
      if (defender.cells.length === 0) break;
      const c = defender.cells.pop();
      grid[c.row][c.col] = actor.id;
      actor.cells.push(c);
    }

    actor.coins = Math.max(0, actor.coins - 35);
    recalcCentroid(actor.id);
    recalcCentroid(defender.id);

    if (defender.cells.length === 0) {
      addLog(`💀 ${defender.name} was wiped out completely by ${actor.name}!`, "log-war");
    } else {
      addLog(`⚔️ ${actor.name} conquered borderlands from ${defender.name}!`, "log-war");
    }
  } else {
    actor.coins = Math.max(0, actor.coins - 80);
    addLog(`🛡️ ${defender.name} held ground against ${actor.name}!`, "log-dodge");
  }
}

// Buyout Chunk
function attemptChunkPurchase(actor) {
  const frontier = findFrontierCells(actor);
  if (frontier.length === 0) return;

  const target = frontier[Math.floor(Math.random() * frontier.length)];
  const sellerId = grid[target.row][target.col];
  const seller = nations[sellerId];

  const price = 300 + (seller.cells.length * 10);
  if (actor.coins >= price) {
    actor.coins -= price;
    seller.coins += Math.floor(price * 0.85);

    // Transfer 4 cells
    for (let i = 0; i < 4; i++) {
      if (seller.cells.length <= 1) break;
      const c = seller.cells.pop();
      grid[c.row][c.col] = actor.id;
      actor.cells.push(c);
    }

    recalcCentroid(actor.id);
    recalcCentroid(seller.id);
    addLog(`💰 ${actor.name} purchased border territory from ${seller.name} for ${price} coins!`, "log-buy");
  }
}

function attemptAlliance(actor, activeIds) {
  const candidates = activeIds.filter(id => id !== actor.id && !actor.allies.includes(id));
  if (candidates.length === 0) return;

  const allyId = candidates[Math.floor(Math.random() * candidates.length)];
  actor.allies.push(allyId);
  nations[allyId].allies.push(actor.id);
  addLog(`🤝 Alliance: ${actor.name} & ${nations[allyId].name}!`, "log-alliance");
}

function attemptWartimeMerge(actor, activeIds) {
  const frontier = findFrontierCells(actor);
  const smallNeighbors = frontier.map(f => grid[f.row][f.col]).filter(id => id !== actor.id && nations[id].cells.length <= 12);
  if (smallNeighbors.length === 0) return;

  const partnerId = smallNeighbors[0];
  const partner = nations[partnerId];

  partner.cells.forEach(c => {
    grid[c.row][c.col] = actor.id;
    actor.cells.push(c);
  });
  partner.cells = [];
  partner.isMergedSub = true;
  partner.mergedWith = actor.id;
  actor.coins += partner.coins;
  partner.coins = 0;

  recalcCentroid(actor.id);
  addLog(`🧬 MERGER: ${partner.name} combined into ${actor.name} for mutual defense!`, "log-merge");
}

function attemptRevolt(activeIds) {
  const empires = activeIds.filter(id => nations[id].cells.length >= 25);
  if (empires.length === 0) return;

  const targetEmpire = nations[empires[Math.floor(Math.random() * empires.length)]];
  const rebelNationIds = Object.keys(nations).filter(id => nations[id].cells.length === 0 && !nations[id].isOcean);
  if (rebelNationIds.length === 0) return;

  const rebelId = rebelNationIds[Math.floor(Math.random() * rebelNationIds.length)];
  const rebel = nations[rebelId];

  rebel.isMergedSub = false;
  rebel.mergedWith = null;
  rebel.coins = 350;

  // Carve out 8 cells
  for (let i = 0; i < 8; i++) {
    if (targetEmpire.cells.length <= 5) break;
    const c = targetEmpire.cells.pop();
    grid[c.row][c.col] = rebel.id;
    rebel.cells.push(c);
  }

  recalcCentroid(rebel.id);
  recalcCentroid(targetEmpire.id);
  addLog(`🔥 REVOLT! ${rebel.name} declared independence from ${targetEmpire.name}!`, "log-revolt");
}

function findFrontierCells(actor) {
  const frontiers = [];
  const dirs = [[0,1], [0,-1], [1,0], [-1,0]];

  actor.cells.forEach(cell => {
    dirs.forEach(([dc, dr]) => {
      const nc = cell.col + dc;
      const nr = cell.row + dr;
      if (nc >= 0 && nc < COLS && nr >= 0 && nr < ROWS) {
        if (grid[nr][nc] !== actor.id) {
          frontiers.push({ col: nc, row: nr });
        }
      }
    });
  });
  return frontiers;
}

function handleCellClick(col, row) {
  const ownerId = grid[row][col];
  const owner = nations[ownerId];
  showToast(`${owner.name} (${ownerId}) | Cells: ${owner.cells.length} | Gold: ${owner.coins}`);
}

function updateUI() {
  const activeNations = Object.values(nations).filter(n => n.cells.length > 0 && !n.isMergedSub);
  document.getElementById("nation-count").textContent = activeNations.length;

  const sorted = [...activeNations].sort((a, b) => (b.cells.length * 100 + b.coins) - (a.cells.length * 100 + a.coins));
  const lbContainer = document.getElementById("lb-container");
  lbContainer.innerHTML = "";

  sorted.forEach((n, idx) => {
    const row = document.createElement("div");
    row.className = "lb-row";
    row.innerHTML = `
      <div class="lb-left">
        <span>#${idx+1}</span>
        <div class="color-dot" style="background:${n.color}"></div>
        <strong>${n.name}</strong>
      </div>
      <div>
        <span style="color:var(--text-dim);margin-right:8px;">${n.cells.length} px</span>
        <span style="color:var(--accent-gold);font-weight:800;">${n.coins}g</span>
      </div>
    `;
    lbContainer.appendChild(row);
  });
}

function addLog(msg, typeClass) {
  const container = document.getElementById("feed-container");
  const entry = document.createElement("div");
  entry.className = `log-entry ${typeClass || ''}`;
  entry.textContent = `[Y${year}] ${msg}`;
  container.prepend(entry);
  if (container.children.length > 50) {
    container.removeChild(container.lastChild);
  }
}

function showToast(text) {
  const toast = document.getElementById("toast");
  toast.textContent = text;
  toast.style.opacity = "1";
  setTimeout(() => toast.style.opacity = "0", 2200);
}

function populateDropdown() {
  const sel = document.getElementById("state-select");
  sel.innerHTML = '<option value="">-- Choose State to Fund --</option>';
  Object.keys(nations).forEach(id => {
    if (!nations[id].isOcean) {
      const opt = document.createElement("option");
      opt.value = id;
      opt.textContent = nations[id].name;
      sel.appendChild(opt);
    }
  });

  sel.addEventListener("change", (e) => {
    const chosen = e.target.value;
    if (chosen && nations[chosen]) {
      nations[chosen].coins += 5000;
      addLog(`👑 ROYAL GRANT: ${nations[chosen].name} received 5,000 coins!`, "log-buy");
      updateUI();
      paintMap();
    }
  });
}

function toggleSimulation() {
  if (isRunning) {
    pauseSimulation();
  } else {
    isRunning = true;
    document.getElementById("sim-status").textContent = "RUNNING";
    document.getElementById("sim-status").style.color = "var(--accent-green)";
    simInterval = setInterval(stepTurn, 500);
  }
}

function pauseSimulation() {
  isRunning = false;
  clearInterval(simInterval);
  document.getElementById("sim-status").textContent = "PAUSED";
  document.getElementById("sim-status").style.color = "#fff";
}

document.getElementById("btn-toggle").addEventListener("click", toggleSimulation);
document.getElementById("btn-step").addEventListener("click", stepTurn);

document.getElementById("btn-random-rich").addEventListener("click", () => {
  const activeIds = Object.keys(nations).filter(id => nations[id].cells.length > 0 && !nations[id].isMergedSub && !nations[id].isOcean);
  if (activeIds.length === 0) return;
  const pickedId = activeIds[Math.floor(Math.random() * activeIds.length)];
  nations[pickedId].coins += Math.floor(Math.random() * 6000) + 4000;
  addLog(`🎰 JACKPOT: ${nations[pickedId].name} struck gold!`, "log-buy");
  showToast(`${nations[pickedId].name} is now filthy rich!`);
  updateUI();
});

document.getElementById("btn-drain").addEventListener("click", () => {
  Object.keys(nations).forEach(id => {
    const nation = nations[id];
    const lost = Math.floor(nation.coins * 0.45);
    nation.coins = Math.max(0, nation.coins - lost);
  });
  addLog("📉 RESOURCE DRAIN: All active factions burned 45% of treasury!", "log-war");
  showToast("Mass resource drain applied!");
  updateUI();
});

document.getElementById("tab-log").addEventListener("click", () => {
  document.getElementById("tab-log").classList.add("active");
  document.getElementById("tab-lb").classList.remove("active");
  document.getElementById("feed-container").style.display = "flex";
  document.getElementById("lb-container").style.display = "none";
});

document.getElementById("tab-lb").addEventListener("click", () => {
  document.getElementById("tab-lb").classList.add("active");
  document.getElementById("tab-log").classList.remove("active");
  document.getElementById("feed-container").style.display = "none";
  document.getElementById("lb-container").style.display = "flex";
});

window.addEventListener("DOMContentLoaded", initSimulation);
</script>
</body>
</html>
