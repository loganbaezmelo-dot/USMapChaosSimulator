<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>US Map Chaos Simulator</title>
<style>
  :root {
    --bg-ocean: #0b1322;
    --panel-bg: rgba(14, 20, 32, 0.96);
    --border-color: #2a3a54;
    --text-main: #f0f4fc;
    --text-dim: #8fa0be;
    --accent-gold: #ffd166;
    --accent-red: #ef476f;
    --accent-green: #06d6a0;
    --accent-purple: #b5179e;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    background: #070b12;
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  #app {
    display: flex;
    width: 100vw;
    height: 100vh;
  }

  #viewport {
    flex: 1;
    position: relative;
    background: radial-gradient(ellipse at 50% 50%, #16243b 0%, #090e18 100%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  svg#map {
    width: 100%;
    height: 100%;
    max-height: 98vh;
  }

  .state-poly {
    stroke: #121824;
    stroke-width: 1.4;
    stroke-linejoin: round;
    cursor: pointer;
    transition: fill 0.25s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.2s;
  }

  .state-poly:hover {
    stroke: #ffffff;
    stroke-width: 2.5;
    filter: brightness(1.15);
  }

  .ocean-zone {
    fill: rgba(22, 38, 64, 0.55);
    stroke: #2e476d;
    stroke-width: 1.2;
    stroke-dasharray: 4, 3;
    cursor: pointer;
    transition: all 0.2s;
  }

  .ocean-zone:hover {
    fill: rgba(36, 62, 102, 0.8);
    stroke: var(--accent-gold);
  }

  .naval-lane {
    stroke: rgba(255, 209, 102, 0.4);
    stroke-width: 1.6;
    stroke-dasharray: 5, 5;
    fill: none;
    pointer-events: none;
    animation: dashPulse 25s linear infinite;
  }

  @keyframes dashPulse {
    to { stroke-dashoffset: -100; }
  }

  .dock-box {
    stroke: #2b3d58;
    stroke-width: 1.5;
    stroke-dasharray: 4, 4;
    fill: rgba(11, 19, 34, 0.7);
  }

  .dock-label {
    fill: var(--text-dim);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  .capital-marker {
    fill: #ffffff;
    stroke: #dc2626;
    stroke-width: 2.2;
    filter: drop-shadow(0 0 3px rgba(0,0,0,0.8));
    cursor: pointer;
    transition: cx 0.4s ease-out, cy 0.4s ease-out;
  }

  .capital-marker.dodging {
    fill: #ffd166;
    stroke: #ff0055;
    filter: drop-shadow(0 0 8px #ff0055);
  }

  .state-label {
    fill: #ffffff;
    font-size: 8.5px;
    font-weight: 900;
    text-anchor: middle;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 0 4px rgba(0,0,0,0.8);
  }

  /* HUD overlay */
  #stats-overlay {
    position: absolute;
    top: 14px;
    left: 14px;
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    padding: 8px 14px;
    border-radius: 8px;
    display: flex;
    gap: 16px;
    font-size: 0.88rem;
    font-weight: 800;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }

  #toast {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(14, 20, 32, 0.95);
    border: 1px solid var(--accent-gold);
    color: #fff;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 800;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s ease;
    z-index: 100;
    box-shadow: 0 0 12px rgba(255, 209, 102, 0.25);
  }

  /* Sidebar Tablet Controller */
  #sidebar {
    width: 360px;
    background: var(--panel-bg);
    border-left: 2px solid var(--border-color);
    display: flex;
    flex-direction: column;
    padding: 14px;
    gap: 12px;
    backdrop-filter: blur(10px);
    z-index: 10;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 10px;
  }

  .panel-title {
    font-weight: 900;
    font-size: 1.05rem;
    color: var(--accent-gold);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-badge {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 800;
  }

  .controls-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  button.btn {
    background: #1e293b;
    color: #fff;
    border: 1px solid var(--border-color);
    padding: 10px;
    font-size: 0.82rem;
    font-weight: 800;
    border-radius: 8px;
    cursor: pointer;
    touch-action: manipulation;
    transition: all 0.15s ease;
  }

  button.btn:active {
    transform: scale(0.96);
  }

  button.btn-accent {
    background: #e63946;
    border-color: #ff4d6d;
  }

  button.btn-gold {
    background: #ca8a04;
    border-color: #facc15;
    color: #fff;
  }

  .select-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .select-row label {
    font-size: 0.72rem;
    color: var(--text-dim);
    font-weight: 800;
  }

  select {
    background: #111827;
    border: 1px solid var(--border-color);
    color: #fff;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 0.85rem;
    outline: none;
    font-weight: 700;
  }

  .tabs {
    display: flex;
    background: #0f172a;
    border-radius: 6px;
    padding: 2px;
    border: 1px solid var(--border-color);
  }

  .tab-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 7px;
    font-size: 0.78rem;
    font-weight: 800;
    cursor: pointer;
    border-radius: 4px;
  }

  .tab-btn.active {
    background: #1e293b;
    color: #fff;
  }

  .scroll-container {
    flex: 1;
    background: #090e17;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .log-entry {
    padding: 5px 7px;
    border-radius: 4px;
    background: #111827;
    border-left: 3px solid #64748b;
    font-size: 0.76rem;
    line-height: 1.35;
  }

  .log-war { border-left-color: var(--accent-red); }
  .log-buy { border-left-color: var(--accent-gold); }
  .log-merge { border-left-color: var(--accent-purple); }
  .log-revolt { border-left-color: #f97316; }
  .log-alliance { border-left-color: var(--accent-green); }
  .log-dodge { border-left-color: #38bdf8; }

  .lb-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 8px;
    background: #111827;
    border-radius: 4px;
    font-size: 0.78rem;
  }

  .lb-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .color-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
</style>
</head>
<body>

<div id="app">
  <div id="viewport">
    <div id="stats-overlay">
      <div>Year: <span id="year-count" style="color:var(--accent-gold)">1</span></div>
      <div>Active Nations: <span id="nation-count" style="color:var(--accent-green)">51</span></div>
    </div>

    <div id="toast">Florida relocated to Havana!</div>

    <!-- Scaled coordinate grid: 960x600 -->
    <svg id="map" viewBox="0 0 960 600">
      <defs>
        <pattern id="ocean-dots" width="16" height="16" patternUnits="userSpaceOnUse">
          <circle cx="2" cy="2" r="0.8" fill="rgba(255,255,255,0.06)" />
        </pattern>
      </defs>

      <!-- Background Grid -->
      <rect width="960" height="600" fill="url(#ocean-dots)" />

      <!-- Alaska, Hawaii & Puerto Rico Dock Frames -->
      <g id="dock-frames">
        <rect x="40" y="470" width="170" height="110" rx="8" class="dock-box" />
        <text x="50" y="485" class="dock-label">Sector Alaska</text>

        <rect x="225" y="470" width="175" height="110" rx="8" class="dock-box" />
        <text x="235" y="485" class="dock-label">Sector Hawaii</text>

        <rect x="740" y="470" width="180" height="110" rx="8" class="dock-box" />
        <text x="750" y="485" class="dock-label">Sector Puerto Rico</text>
      </g>

      <!-- Ocean connection lanes -->
      <g id="naval-lanes"></g>

      <!-- Ocean Hubs / Annexable Sea Tiles -->
      <g id="ocean-tiles"></g>

      <!-- Mainland & Offshore States -->
      <g id="territories"></g>

      <!-- Capital markers (auto-dodge) -->
      <g id="capitals"></g>

      <!-- Labels -->
      <g id="labels"></g>
    </svg>
  </div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="panel-header">
      <div class="panel-title">⚡ STATE SIMULATOR</div>
      <div class="status-badge" id="sim-status">PAUSED</div>
    </div>

    <div class="controls-grid">
      <button class="btn btn-accent" id="btn-toggle">START / PAUSE</button>
      <button class="btn" id="btn-step">NEXT TURN</button>
      <button class="btn btn-gold" id="btn-random-rich">REROLL COIN KING</button>
      <button class="btn" id="btn-drain">WASTE RESOURCES</button>
    </div>

    <div class="select-row">
      <label>MANUAL COIN INJECTION:</label>
      <select id="state-select">
        <option value="">-- Choose State to Fund --</option>
      </select>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-log">BATTLE FEED</button>
      <button class="tab-btn" id="tab-lb">LEADERBOARD</button>
    </div>

    <div class="scroll-container" id="feed-container"></div>
    <div class="scroll-container" id="lb-container" style="display:none;"></div>
  </div>
</div>

  ATLANTIC_S: { name: "Bermuda Trench", path: "M 675,370 L 780,370 L 760,470 L 655,460 Z", cx: 718, cy: 418, adj: ["FL", "GA", "SC", "PR", "CARIBBEAN_TILE"], ocean: ["ATLANTIC_MID"], isOceanHub: true },
  ATLANTIC_MID: { name: "Chesapeake Basin", path: "M 735,260 L 850,260 L 820,365 L 705,355 Z", cx: 778, cy: 310, adj: ["NC", "VA", "MD", "DE", "ATLANTIC_S"], ocean: ["ATLANTIC_N"], isOceanHub: true },
  ATLANTIC_N: { name: "New England Shelf", path: "M 800,120 L 920,120 L 880,245 L 760,240 Z", cx: 840, cy: 180, adj: ["ME", "NH", "MA", "CT", "RI", "NJ", "NY", "ATLANTIC_MID"], ocean: [], isOceanHub: true }
};

const VIBRANT_COLORS = [
  "#ef476f", "#f78c6c", "#ffd166", "#06d6a0", "#118ab2",
  "#073b4c", "#8338ec", "#3a86ff", "#ff006e", "#fb5607",
  "#70e000", "#38bdf8", "#a855f7", "#ec4899", "#14b8a6",
  "#f43f5e", "#6366f1", "#84cc16", "#eab308", "#06b6d4"
];

let stateData = {};
let nations = {};
let year = 1;
let isRunning = false;
let simInterval = null;

function initSimulation() {
  stateData = {};
  nations = {};
  let colorIdx = 0;

  Object.keys(NODES).forEach((id) => {
    const node = NODES[id];
    const isOcean = !!node.isOceanHub;
    const initialCoins = isOcean ? 150 : Math.floor(Math.random() * 800) + 400;

    nations[id] = {
      id: id,
      name: node.name,
      color: isOcean ? "#182842" : VIBRANT_COLORS[colorIdx % VIBRANT_COLORS.length],
      coins: initialCoins,
      territories: [id],
      allies: [],
      mergedWith: null,
      isMergedSub: false,
      capital: { x: node.cx, y: node.cy, currentRegion: id },
      originalOwner: id,
      isOceanHub: isOcean
    };

    if (!isOcean) colorIdx++;
    stateData[id] = { owner: id };
  });

  renderMap();
  populateDropdown();
  updateUI();
  addLog("Simulation initialized with high-definition boundaries & dock hubs.", "log-dodge");
}

function renderMap() {
  const terrGroup = document.getElementById("territories");
  const oceanGroup = document.getElementById("ocean-tiles");
  const capGroup = document.getElementById("capitals");
  const lblGroup = document.getElementById("labels");
  const laneGroup = document.getElementById("naval-lanes");

  terrGroup.innerHTML = "";
  oceanGroup.innerHTML = "";
  capGroup.innerHTML = "";
  lblGroup.innerHTML = "";
  laneGroup.innerHTML = "";

  // Render Naval Connection Lanes
  Object.keys(NODES).forEach(id => {
    const node = NODES[id];
    node.adj.forEach(targetId => {
      const target = NODES[targetId];
      if ((node.isOceanHub || target.isOceanHub) && id < targetId) {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", node.cx);
        line.setAttribute("y1", node.cy);
        line.setAttribute("x2", target.cx);
        line.setAttribute("y2", target.cy);
        line.setAttribute("class", "naval-lane");
        laneGroup.appendChild(line);
      }
    });
  });

  // Render Polygons (Territories vs Ocean Tiles)
  Object.keys(NODES).forEach((id) => {
    const node = NODES[id];
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", node.path);
    path.setAttribute("id", "poly-" + id);
    path.addEventListener("click", () => handleTerritoryClick(id));

    if (node.isOceanHub) {
      path.setAttribute("class", "ocean-zone");
      oceanGroup.appendChild(path);
    } else {
      path.setAttribute("class", "state-poly");
      terrGroup.appendChild(path);
    }

    // Text Label
    const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
    txt.setAttribute("x", node.cx);
    txt.setAttribute("y", node.cy + 3);
    txt.setAttribute("id", "lbl-" + id);
    txt.setAttribute("class", "state-label");
    txt.textContent = id.replace(/_TILE|_NW|_MID|_N|_S|_E|_W/g, '');
    lblGroup.appendChild(txt);
  });

  // Render Capital City Dots
  Object.keys(nations).forEach((id) => {
    const nation = nations[id];
    if (nation.isOceanHub) return;

    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("cx", nation.capital.x);
    circle.setAttribute("cy", nation.capital.y);
    circle.setAttribute("r", 4.2);
    circle.setAttribute("id", "cap-" + id);
    circle.setAttribute("class", "capital-marker");
    circle.addEventListener("click", (e) => {
      e.stopPropagation();
      manualMoveCapital(id);
    });
    capGroup.appendChild(circle);
  });

  paintMap();
}

function paintMap() {
  Object.keys(NODES).forEach((id) => {
    const ownerId = stateData[id].owner;
    const ownerNation = nations[ownerId];
    const poly = document.getElementById("poly-" + id);
    if (poly && ownerNation) {
      poly.setAttribute("fill", ownerNation.color);
    }
  });

  Object.keys(nations).forEach((id) => {
    const nation = nations[id];
    const capCircle = document.getElementById("cap-" + id);
    if (!capCircle) return;

    if (nation.territories.length === 0 || nation.isMergedSub) {
      capCircle.style.display = "none";
    } else {
      capCircle.style.display = "block";
      capCircle.setAttribute("cx", nation.capital.x);
      capCircle.setAttribute("cy", nation.capital.y);
    }
  });
}

// Capital Dodge Function
function checkCapitalDangerAndDodge(nationId) {
  const nation = nations[nationId];
  if (!nation || nation.territories.length <= 1) return;

  const currentReg = nation.capital.currentRegion;
  const adjacent = NODES[currentReg].adj;
  const inDanger = adjacent.some(adjId => stateData[adjId].owner !== nationId);

  if (inDanger) {
    const safeRegions = nation.territories.filter(tId => {
      return !NODES[tId].adj.some(adjId => stateData[adjId].owner !== nationId);
    });

    const targetRegionId = safeRegions.length > 0 ? safeRegions[0] : nation.territories.find(t => t !== currentReg);

    if (targetRegionId && targetRegionId !== currentReg) {
      nation.capital.currentRegion = targetRegionId;
      nation.capital.x = NODES[targetRegionId].cx;
      nation.capital.y = NODES[targetRegionId].cy;

      const capCircle = document.getElementById("cap-" + nationId);
      if (capCircle) {
        capCircle.classList.add("dodging");
        setTimeout(() => capCircle.classList.remove("dodging"), 500);
      }
      addLog(`🚨 ${nation.name} capital evacuated from ${currentReg} to ${targetRegionId}!`, "log-dodge");
    }
  }
}

function manualMoveCapital(nationId) {
  const nation = nations[nationId];
  if (!nation || nation.territories.length === 0) return;
  const currentIndex = nation.territories.indexOf(nation.capital.currentRegion);
  const nextRegion = nation.territories[(currentIndex + 1) % nation.territories.length];
  
  nation.capital.currentRegion = nextRegion;
  nation.capital.x = NODES[nextRegion].cx;
  nation.capital.y = NODES[nextRegion].cy;
  paintMap();
  showToast(`${nation.name} relocated capital to ${nextRegion}!`);
}

// Core Engine Step
function stepTurn() {
  year++;
  document.getElementById("year-count").textContent = year;

  // Economy & Resource Upkeep
  Object.keys(nations).forEach(id => {
    const nation = nations[id];
    if (nation.territories.length === 0 || nation.isMergedSub) return;

    const income = (nation.territories.length * 40) + Math.floor(Math.random() * 25);
    const drain = Math.floor(nation.territories.length * 12);
    nation.coins = Math.max(0, nation.coins + income - drain);

    checkCapitalDangerAndDodge(id);
  });

  const activeIds = Object.keys(nations).filter(id => nations[id].territories.length > 0 && !nations[id].isMergedSub);
  if (activeIds.length <= 1) {
    pauseSimulation();
    showToast(`Simulation ended! Champion: ${nations[activeIds[0]].name}`);
    return;
  }

  const actorId = activeIds[Math.floor(Math.random() * activeIds.length)];
  const actor = nations[actorId];
  const roll = Math.random();

  // 1. Buyout
  if (roll < 0.28 && actor.coins >= 450) {
    attemptTerritoryPurchase(actor);
  }
  // 2. Alliance
  else if (roll < 0.45) {
    attemptAlliance(actor, activeIds);
  }
  // 3. Coalition Merge
  else if (roll < 0.58 && actor.territories.length < 3) {
    attemptWartimeMerge(actor, activeIds);
  }
  // 4. Revolt
  else if (roll < 0.72) {
    attemptRevolt(activeIds);
  }
  // 5. War / Annexation
  else {
    attemptWarConquest(actor);
  }

  paintMap();
  updateUI();
}

function attemptTerritoryPurchase(actor) {
  const targets = findForeignNeighbors(actor);
  if (targets.length === 0) return;

  const targetTerrId = targets[Math.floor(Math.random() * targets.length)];
  const targetOwnerId = stateData[targetTerrId].owner;
  const seller = nations[targetOwnerId];

  const price = 400 + (seller.territories.length * 50);
  if (actor.coins >= price) {
    actor.coins -= price;
    seller.coins += Math.floor(price * 0.85);

    transferTerritory(targetTerrId, actor.id);
    addLog(`💰 ${actor.name} bought ${targetTerrId} from ${seller.name} for ${price} coins!`, "log-buy");
  }
}

function attemptAlliance(actor, activeIds) {
  const candidates = activeIds.filter(id => id !== actor.id && !actor.allies.includes(id));
  if (candidates.length === 0) return;

  const allyId = candidates[Math.floor(Math.random() * candidates.length)];
  actor.allies.push(allyId);
  nations[allyId].allies.push(actor.id);
  addLog(`🤝 Alliance: ${actor.name} & ${nations[allyId].name}!`, "log-alliance");
}

function attemptWarConquest(actor) {
  const neighbors = findForeignNeighbors(actor);
  if (neighbors.length === 0) return;

  const targetTerrId = neighbors[Math.floor(Math.random() * neighbors.length)];
  const defenderId = stateData[targetTerrId].owner;
  const defender = nations[defenderId];

  if (actor.allies.includes(defenderId)) {
    if (Math.random() < 0.6) return;
    actor.allies = actor.allies.filter(a => a !== defenderId);
    defender.allies = defender.allies.filter(a => a !== actor.id);
    addLog(`💔 Alliance broken: ${actor.name} attacked ${defender.name}!`, "log-war");
  }

  const attackerPower = (actor.territories.length * 20) + (actor.coins * 0.08) + (Math.random() * 40);
  const defenderPower = (defender.territories.length * 20) + (defender.coins * 0.08) + (Math.random() * 40);

  if (attackerPower >= defenderPower * 0.85) {
    transferTerritory(targetTerrId, actor.id);
    actor.coins = Math.max(0, actor.coins - 40);

    if (defender.capital.currentRegion === targetTerrId) {
      if (defender.territories.length > 0) {
        const fallback = defender.territories[0];
        defender.capital.currentRegion = fallback;
        defender.capital.x = NODES[fallback].cx;
        defender.capital.y = NODES[fallback].cy;
        addLog(`⚔️ ${actor.name} took ${defender.name}'s capital! Fled to ${fallback}!`, "log-war");
      } else {
        addLog(`💀 ${defender.name} was wiped out by ${actor.name}!`, "log-war");
      }
    } else {
      addLog(`⚔️ ${actor.name} conquered ${targetTerrId} from ${defender.name}!`, "log-war");
    }
  } else {
    actor.coins = Math.max(0, actor.coins - 100);
    addLog(`🛡️ ${defender.name} repelled ${actor.name} at ${targetTerrId}!`, "log-dodge");
  }
}

function attemptWartimeMerge(actor, activeIds) {
  const neighbors = findForeignNeighbors(actor);
  const friendlies = neighbors.filter(id => {
    const owner = stateData[id].owner;
    return owner !== actor.id && nations[owner].territories.length <= 3;
  });

  if (friendlies.length === 0) return;
  const partnerOwnerId = stateData[friendlies[0]].owner;
  const partner = nations[partnerOwnerId];

  partner.territories.forEach(tId => transferTerritory(tId, actor.id));
  partner.isMergedSub = true;
  partner.mergedWith = actor.id;
  actor.coins += partner.coins;
  partner.coins = 0;

  addLog(`🧬 MERGER: ${partner.name} combined with ${actor.name} for protection!`, "log-merge");
}

function attemptRevolt(activeIds) {
  const empires = activeIds.filter(id => nations[id].territories.length >= 3);
  if (empires.length === 0) return;

  const targetEmpire = nations[empires[Math.floor(Math.random() * empires.length)]];
  const eligibleRevolts = targetEmpire.territories.filter(tId => tId !== targetEmpire.capital.currentRegion);
  if (eligibleRevolts.length === 0) return;

  const revoltTerrId = eligibleRevolts[Math.floor(Math.random() * eligibleRevolts.length)];
  const revivedNation = nations[revoltTerrId];

  if (revivedNation) {
    revivedNation.isMergedSub = false;
    revivedNation.mergedWith = null;
    revivedNation.coins = 350;
    revivedNation.capital.currentRegion = revoltTerrId;
    revivedNation.capital.x = NODES[revoltTerrId].cx;
    revivedNation.capital.y = NODES[revoltTerrId].cy;

    transferTerritory(revoltTerrId, revivedNation.id);
    addLog(`🔥 REVOLT! ${revivedNation.name} broke free from ${targetEmpire.name}!`, "log-revolt");
  }
}

function transferTerritory(territoryId, newOwnerId) {
  const oldOwnerId = stateData[territoryId].owner;
  if (oldOwnerId && nations[oldOwnerId]) {
    nations[oldOwnerId].territories = nations[oldOwnerId].territories.filter(t => t !== territoryId);
  }
  stateData[territoryId].owner = newOwnerId;
  if (!nations[newOwnerId].territories.includes(territoryId)) {
    nations[newOwnerId].territories.push(territoryId);
  }
}

function findForeignNeighbors(actor) {
  const neighbors = new Set();
  actor.territories.forEach(tId => {
    const node = NODES[tId];
    if (node && node.adj) {
      node.adj.forEach(adjId => {
        if (stateData[adjId].owner !== actor.id) {
          neighbors.add(adjId);
        }
      });
    }
  });
  return Array.from(neighbors);
}

function handleTerritoryClick(territoryId) {
  const ownerId = stateData[territoryId].owner;
  const owner = nations[ownerId];
  showToast(`${NODES[territoryId].name} (${territoryId}) | Owner: ${owner.name} (${owner.coins} coins)`);
}

function updateUI() {
  const activeNations = Object.values(nations).filter(n => n.territories.length > 0 && !n.isMergedSub);
  document.getElementById("nation-count").textContent = activeNations.length;

  const sorted = [...activeNations].sort((a, b) => (b.territories.length * 100 + b.coins) - (a.territories.length * 100 + a.coins));
  const lbContainer = document.getElementById("lb-container");
  lbContainer.innerHTML = "";

  sorted.forEach((n, idx) => {
    const row = document.createElement("div");
    row.className = "lb-row";
    row.innerHTML = `
      <div class="lb-left">
        <span>#${idx+1}</span>
        <div class="color-dot" style="background:${n.color}"></div>
        <strong>${n.name}</strong>
      </div>
      <div>
        <span style="color:var(--text-dim);margin-right:8px;">${n.territories.length} terr</span>
        <span style="color:var(--accent-gold);font-weight:800;">${n.coins}g</span>
      </div>
    `;
    lbContainer.appendChild(row);
  });
}

function addLog(msg, typeClass) {
  const container = document.getElementById("feed-container");
  const entry = document.createElement("div");
  entry.className = `log-entry ${typeClass || ''}`;
  entry.textContent = `[Y${year}] ${msg}`;
  container.prepend(entry);
  if (container.children.length > 50) {
    container.removeChild(container.lastChild);
  }
}

function showToast(text) {
  const toast = document.getElementById("toast");
  toast.textContent = text;
  toast.style.opacity = "1";
  setTimeout(() => toast.style.opacity = "0", 2200);
}

function populateDropdown() {
  const sel = document.getElementById("state-select");
  sel.innerHTML = '<option value="">-- Choose State to Fund --</option>';
  Object.keys(nations).forEach(id => {
    if (!nations[id].isOceanHub) {
      const opt = document.createElement("option");
      opt.value = id;
      opt.textContent = nations[id].name;
      sel.appendChild(opt);
    }
  });

  sel.addEventListener("change", (e) => {
    const chosen = e.target.value;
    if (chosen && nations[chosen]) {
      nations[chosen].coins += 5000;
      addLog(`👑 ROYAL GRANT: ${nations[chosen].name} received 5,000 coins!`, "log-buy");
      updateUI();
      paintMap();
    }
  });
}

function toggleSimulation() {
  if (isRunning) {
    pauseSimulation();
  } else {
    isRunning = true;
    document.getElementById("sim-status").textContent = "RUNNING";
    document.getElementById("sim-status").style.color = "var(--accent-green)";
    simInterval = setInterval(stepTurn, 600);
  }
}

function pauseSimulation() {
  isRunning = false;
  clearInterval(simInterval);
  document.getElementById("sim-status").textContent = "PAUSED";
  document.getElementById("sim-status").style.color = "#fff";
}

document.getElementById("btn-toggle").addEventListener("click", toggleSimulation);
document.getElementById("btn-step").addEventListener("click", stepTurn);

document.getElementById("btn-random-rich").addEventListener("click", () => {
  const activeIds = Object.keys(nations).filter(id => nations[id].territories.length > 0 && !nations[id].isMergedSub && !nations[id].isOceanHub);
  if (activeIds.length === 0) return;
  const pickedId = activeIds[Math.floor(Math.random() * activeIds.length)];
  nations[pickedId].coins += Math.floor(Math.random() * 6000) + 4000;
  addLog(`🎰 JACKPOT: ${nations[pickedId].name} struck gold!`, "log-buy");
  showToast(`${nations[pickedId].name} is now filthy rich!`);
  updateUI();
});

document.getElementById("btn-drain").addEventListener("click", () => {
  Object.keys(nations).forEach(id => {
    const nation = nations[id];
    const lost = Math.floor(nation.coins * 0.45);
    nation.coins = Math.max(0, nation.coins - lost);
  });
  addLog("📉 RESOURCE DRAIN: All active factions burned 45% of treasury!", "log-war");
  showToast("Mass resource drain applied!");
  updateUI();
});

document.getElementById("tab-log").addEventListener("click", () => {
  document.getElementById("tab-log").classList.add("active");
  document.getElementById("tab-lb").classList.remove("active");
  document.getElementById("feed-container").style.display = "flex";
  document.getElementById("lb-container").style.display = "none";
});

document.getElementById("tab-lb").addEventListener("click", () => {
  document.getElementById("tab-lb").classList.add("active");
  document.getElementById("tab-log").classList.remove("active");
  document.getElementById("feed-container").style.display = "none";
  document.getElementById("lb-container").style.display = "flex";
});

window.addEventListener("DOMContentLoaded", initSimulation);
</script>
</body>
</html>
